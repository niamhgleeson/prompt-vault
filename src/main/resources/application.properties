spring.application.name=prompt-vault

spring.datasource.url=jdbc:mysql://localhost:3306/promptvault
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=COOKIE
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.servlet.session.timeout=15m

app.admin.username=${PROMPTVAULT_ADMIN_USERNAME:admin}
app.admin.password=${PROMPTVAULT_ADMIN_PASSWORD}

logging.file.name=logs/promptvault.log
logging.level.SECURITY_AUDIT=INFO

spring.ssl.bundle.jks.web.key.alias=local-https
spring.ssl.bundle.jks.web.keystore.location=classpath:local-https.p12
spring.ssl.bundle.jks.web.keystore.password=${KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.web.keystore.type=PKCS12

server.port=8080
server.ssl.bundle=web